[package]
name = "purple-core"
version = "0.1.0"
edition = "2021"
description = "Exercise logic for the purple app (pelvic floor training), compiled to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
